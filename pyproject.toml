[project]
name = "running-curve25519"
version = "0.1.0"
description = "Concise LaTeX notes and marimo labs from discrete logarithms to X25519"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "marimo>=0.23.16",
  "matplotlib>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/running"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
